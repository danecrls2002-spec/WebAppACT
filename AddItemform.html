<!DOCTYPE html>
<html lang="en">

	<form class="inventory-form">
		<h2>Add New Item</h2>
		
	<label for="item-name">Item Name</label>
	<input type="text" id="Item Name" name="Item Name" required>

	<label for="item-qty">Quantity</label>
	<input type="number" id="item-qty" name="item-qty" min="0" required>
	
	<label for="item-price">Price</label>
	<input for="number" id="item-price" name="item-price" step="0.01">
	
	<label for="item-category">Category</label>
	<select id="item-category" name="item-category">
		<option value="electronics">Electronic</option>
		<option value="grocery">Grocery</option>
	</select>

		<button type="Add Item</button>
</form>
