<!DOCTYPE html>
<html>
	<head>
	<title>Form in HTML</title>
	</head>
	<body style = "text-align:center">
	<body>
	<h2>Registration form</h2>
	<form>
	<fieldset>
		<legend>User personal information</legend>
		<label>Enter your full name</label><br>
		<input type="text"name="name"><br>
		<label>Enter your email address</label><br>
		<input type="email"name="email"><br>
		<label>Enter your password</label><br>
		<input type="password"name="pass"><br>
		<label>Enter your age</label><br>
		<input type="age"name="age"><br>
		<br><label>Enter your gender</label><br>
		<input type="radio"id="gender"name="gender"value="male"/>Male <br>
		<input type="radio"id="gender"name="gender"value="female"/>Female <br/>
		<input type="radio"id="gender"name="gender"value="others"/>others <br/>
		
		<label for="subject">favorite subject:</label>
		
		 <br> <select id="favorite subject" name="favorite subject">
		<option value="" selected disabled>-- menu --</option>
		<option value="math">math</option>
		<option value="science">science</option>
		<option value="english">english</option>
		<option value="ICT">ICT</option>
		</select>
		
		<br><label for="hobbies">hobbies:</label>
		
		 <br> <checkbox id="hobbies" name="hobbies">
		<input type="checkbox"id="hobby1"name="hobby1"value="reading">
		<label for="hobby1"> I like reading </label><br>
		<input type="checkbox"id="hobby2"name="hobby2"value="sports">
		<label for="hobby2"> I want sports </label><br>
		<input type="checkbox"id="hobby3"name="hobby3"value="music">
		<label for="hobby3"> I like music </label><br>
		<input type="checkbox"id="hobby4"name="hobby4"value="Gaming">
		<label for="hobby4"> i want gaming more </label><br>
		</select>
		
		<br>short introduction:<br>
		<textarea></textarea><br>
		<input type="submit"value="submit">
		<input type="reset">
		</fieldset>
		</form>
		</body>
		</html>
